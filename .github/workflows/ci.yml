# CI mínimo — regalalo-backend
# Compilación TypeScript y tests unitarios (Vitest).
# Los tests de integración que necesitan Postgres se omiten solos
# si no hay una base lista (véase tests/helpers/integration-db.ts).

name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop, "feature/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript / build
        run: npm run build

      - name: Tests (Vitest)
        # load-env.ts exige .env.${APP_ENV} (por defecto .env.local).
        # El ejemplo no tiene secretos reales; Vitest ya inyecta valores de prueba
        # y dotenv no los pisa si existen.
        run: |
          cp .env.local.example .env.local
          npm test
